name: Test and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: Formula and unit tests (no dataset needed)
        working-directory: backend
        run: python -m pytest -q tests/test_tangerine_metrics.py tests/test_director.py tests/test_council.py tests/test_planning_session.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Voice client regression test
        run: node tests/voice.test.mjs
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  deploy:
    needs: test
    # Enable by adding the repository variable DEPLOY_ENABLED=true (Settings -> Secrets and variables -> Actions -> Variables)
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Redeploy on the Vultr host over SSH
        env:
          DEPLOY_SHA: ${{ github.sha }}
          VULTR_HOST: ${{ secrets.VULTR_HOST }}
          VULTR_USER: ${{ secrets.VULTR_USER }}
          VULTR_SSH_KEY: ${{ secrets.VULTR_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          printf '%s\n' "$VULTR_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VULTR_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 "$VULTR_USER@$VULTR_HOST" bash -s -- "$DEPLOY_SHA" <<'REMOTE'
            set -euo pipefail
            cd /opt/pulp
            git fetch origin master
            git cat-file -e "$1^{commit}"
            git reset --hard "$1"
            docker compose up -d --build --remove-orphans
            docker image prune -f
            for i in $(seq 1 30); do
              if docker compose exec -T app python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)" </dev/null 2>/dev/null; then echo healthy; exit 0; fi
              sleep 5
            done
            echo "app did not become healthy"; docker compose logs --tail=100 app; exit 1
          REMOTE
